<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Services &amp; Portfolio | Avigo Oil and Gas Integrated Ltd.</title>
  <meta name="description" content="Avigo Oil and Gas Integrated Ltd. — Global Expertise across Oil & Gas, Logistics, Engineering, Environmental Stewardship, and Expanding Global Sectors." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/site.css" />
</head>
<body>
  <div id="corporate-utility-bar" class="corporate-utility-bar">
    <div class="utility-container">
      <div class="utility-left">
        <span class="utility-dot"></span>
        <span id="utility-company-label">Avigo Oil and Gas Integrated Ltd. — Abuja &amp; Port Harcourt, Nigeria</span>
      </div>
      <div id="utility-contact-links" class="utility-right">
        <a href="tel:+2349069655238">+2349069655238</a>
        <span class="utility-sep">|</span>
        <a href="mailto:info@theavigo.com">info@theavigo.com</a>
      </div>
    </div>
  </div>

  <header class="site-header" id="site-header">
    <div class="header-container">
      <a href="/" data-route-link="/" class="brand-logo-link" aria-label="Avigo Oil and Gas Integrated Ltd. Home">
        <img id="header-logo" src="/uploads/logo.png" alt="Avigo Oil and Gas Integrated Ltd." class="header-logo" />
      </a>
      <nav class="desktop-nav" aria-label="Primary Navigation">
        <ul id="desktop-nav-list" class="desktop-nav-list"></ul>
      </nav>
      <div class="header-right-actions">
        <a href="/contact#inquiry-section" data-route-link="/contact#inquiry-section" class="btn-header-cta">Request a Quote</a>
        <button type="button" class="mobile-menu-trigger" id="mobile-menu-trigger" aria-label="Open Navigation Menu" aria-expanded="false">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div id="mobile-drawer-backdrop" class="mobile-drawer-backdrop" aria-hidden="true"></div>
  <aside id="mobile-drawer" class="mobile-drawer" aria-label="Mobile Navigation Drawer">
    <div class="mobile-drawer-header">
      <img id="mobile-drawer-logo" src="/uploads/logo.png" alt="Avigo Oil and Gas" class="mobile-drawer-logo" />
      <button type="button" id="mobile-drawer-close" class="mobile-drawer-close" aria-label="Close Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="mobile-drawer-body">
      <ul id="mobile-nav-list" class="mobile-nav-list"></ul>
      <div class="mobile-drawer-actions">
        <a href="/contact#inquiry-section" data-route-link="/contact#inquiry-section" class="btn-drawer-primary">Request a Consultation / Quote</a>
      </div>
      <div id="mobile-drawer-contact" class="mobile-drawer-contact"></div>
    </div>
  </aside>

  <main id="cms-main-container" class="cms-main-container"></main>
  <footer id="site-footer" class="site-footer"></footer>
  <div id="avigo-admin-floating-pill" class="avigo-admin-floating-pill" style="display:none;"></div>
  <script src="/js/site.js"></script>
</body>
</html>
